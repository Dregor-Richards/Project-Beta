<!DOCTYPE html>
<html lang="en">
<head>

  <title>High Scores</title>

  <link rel="stylesheet" href="../style.css">
</head>

<body>
  <div class="setup-screen">
    <div class="setup-panel">
      <h2>High Scores</h2>

    </div>
  </div>

  <script src="../js/audio.js"></script>
  <script src="../js/highScores.js"></script>
