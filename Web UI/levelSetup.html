<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Level Setup</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>
    function showMenuConfirm() {
      const menuModal = document.getElementById('setup-menu-modal');
      menuModal.classList.remove('hidden');
    }

    function goToLevel() {
      const raw = document.getElementById("size-input").value;
      const n = Number(raw);

      // Check range instead of clamping
      if (!Number.isInteger(n) || n < 2 || n > 10) {
        const rangeModal = document.getElementById('range-modal');
        rangeModal.classList.remove('hidden');
        return; // do not proceed
      }

      sessionStorage.setItem('currentLevel', '1'); // new run
      sessionStorage.removeItem('playerScore');
      sessionStorage.removeItem('playerLives');

      window.location.href = "level.html?size=" + n;
    }

      // Wait for DOM before wiring events
      window.addEventListener('DOMContentLoaded', () => {
        const controlButton = document.querySelector('.control-button');
        const controlModal = document.getElementById('control-modal');
        const controlOk = document.getElementById('control-ok');

        controlButton.addEventListener('click', () => {
          controlModal.classList.remove('hidden');
        });

        controlOk.addEventListener('click', () => {
          controlModal.classList.add('hidden');
        });

        // Menu modal wiring
        const menuModal = document.getElementById('setup-menu-modal');
        const menuYes = document.getElementById('setup-menu-yes');
        const menuNo = document.getElementById('setup-menu-no');

        menuYes.addEventListener('click', () => {
          window.location.href = 'index.html';
        });

        menuNo.addEventListener('click', () => {
          menuModal.classList.add('hidden');
        });

        // Range modal wiring
        const rangeModal = document.getElementById('range-modal');
        const rangeOk = document.getElementById('range-ok');
        rangeOk.addEventListener('click', () => {
          rangeModal.classList.add('hidden');
        });

        // Enter key triggers GO, Escape closes open modals
        const goButton = document.getElementById('go-button');
        window.addEventListener('keydown', (event) => {
          const anyModalOpen =
            !rangeModal.classList.contains('hidden') ||
            !menuModal.classList.contains('hidden') ||
            !controlModal.classList.contains('hidden');

          // Enter: trigger Begin when no modal is open
          if (!anyModalOpen &&
              (event.key === 'Enter' || event.key === 'e' || event.key === 'E')) {
            event.preventDefault();
            goButton.click();
            return;
          }

          // Escape: close whichever modal(s) are open
          if (event.key === 'Escape') {
            let closed = false;

            if (!rangeModal.classList.contains('hidden')) {
              rangeModal.classList.add('hidden');
              closed = true;
            }

            if (!menuModal.classList.contains('hidden')) {
              menuModal.classList.add('hidden');
              closed = true;
            }

            if (!controlModal.classList.contains('hidden')) {
              controlModal.classList.add('hidden');
              closed = true;
            }

            if (closed) {
              event.preventDefault();
            }
          }
        });
      });


  </script>
</head>
<body>
  <!-- Top-left Menu button -->
  <button class="menu-button" onclick="showMenuConfirm()">
    Menu
  </button>

  <!-- Control Config Modal -->
  <div id="control-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Controls</h2>
      <p>Use WASD or Arrow Keys to move.</p>
      <button id="control-ok" class="modal-ok-button">OK</button>
    </div>
  </div>

  <!-- Menu Confirm Modal -->
    <div id="setup-menu-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Return to Menu?</h2>
      <p>Unsaved changes will be lost.</p>
      <button id="setup-menu-yes" class="modal-ok-button">Yes, go to Menu</button>
      <button id="setup-menu-no" class="modal-ok-button">Cancel</button>
    </div>
  </div>

  <div id="range-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Invalid Difficulty</h2>
      <p>Please choose a difficulty between 3 and 10.</p>
      <button id="range-ok" class="modal-ok-button">OK</button>
    </div>
  </div>

  <main class="setup-screen">
    <div class="setup-panel">
      <label for="size-input" class="setup-label">Difficulty (3-10):</label>
      <input
        id="size-input"
        class="size-input"
        type="number"
        min="3"
        max="10"
        step="1"
        value="3"
      >

    <button id="go-button" class="go-button" onclick="goToLevel()">
      Begin
    </button>

    </div>

    <!-- Lower-left Control Config button -->
    <button class="control-button">
      Controls
    </button>
  </main>
</body>
</html>
